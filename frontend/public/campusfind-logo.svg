<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1000 1000"
  width="1000"
  height="1000"
>
  <!-- Background -->
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Outer rounded border -->
  <rect
    x="25"
    y="25"
    width="950"
    height="950"
    rx="70"
    fill="white"
    stroke="#111111"
    stroke-width="22"
  />

  <!-- ========================= -->
  <!-- TOP WARNING STRIPE -->
  <!-- ========================= -->

  <clipPath id="topClip">
    <rect x="40" y="40" width="920" height="125" rx="45"/>
  </clipPath>

  <g clip-path="url(#topClip)">
    <rect x="40" y="40" width="920" height="125" fill="#111111"/>

    <g fill="#ffe500">
      <polygon points="20,40 120,40 20,165 -80,165"/>
      <polygon points="190,40 290,40 190,165 90,165"/>
      <polygon points="360,40 460,40 360,165 260,165"/>
      <polygon points="530,40 630,40 530,165 430,165"/>
      <polygon points="700,40 800,40 700,165 600,165"/>
      <polygon points="870,40 970,40 870,165 770,165"/>
      <polygon points="1040,40 1140,40 1040,165 940,165"/>
    </g>
  </g>

  <!-- ========================= -->
  <!-- MAIN TITLE -->
  <!-- ========================= -->

  <text
    x="500"
    y="320"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="145"
    font-weight="900"
    letter-spacing="3"
    fill="#080808"
  >
    CAMPUS
  </text>

  <text
    x="430"
    y="485"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="145"
    font-weight="900"
    letter-spacing="3"
    fill="#080808"
  >
    FIND
  </text>

  <!-- ========================= -->
  <!-- MAGNIFYING GLASS -->
  <!-- ========================= -->

  <circle
    cx="760"
    cy="435"
    r="105"
    fill="#ffffff"
    stroke="#080808"
    stroke-width="24"
  />

  <!-- Backpack -->
  <rect
    x="710"
    y="405"
    width="100"
    height="115"
    rx="22"
    fill="#111111"
  />

  <!-- Backpack top handle -->
  <path
    d="M735 405 C735 370 785 370 785 405"
    fill="none"
    stroke="#111111"
    stroke-width="20"
    stroke-linecap="round"
  />

  <!-- Backpack front -->
  <rect
    x="728"
    y="440"
    width="64"
    height="45"
    rx="8"
    fill="#ffffff"
  />

  <rect
    x="735"
    y="447"
    width="50"
    height="31"
    rx="5"
    fill="#111111"
  />

  <!-- Backpack straps -->
  <path
    d="M710 425 C685 445 685 495 710 505"
    fill="none"
    stroke="#111111"
    stroke-width="18"
    stroke-linecap="round"
  />

  <path
    d="M810 425 C835 445 835 495 810 505"
    fill="none"
    stroke="#111111"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Magnifying glass handle -->
  <line
    x1="835"
    y1="510"
    x2="910"
    y2="585"
    stroke="#080808"
    stroke-width="30"
    stroke-linecap="round"
  />

  <!-- Yellow search highlights -->
  <line
    x1="840"
    y1="350"
    x2="865"
    y2="315"
    stroke="#ffe500"
    stroke-width="18"
    stroke-linecap="round"
  />

  <line
    x1="880"
    y1="375"
    x2="915"
    y2="350"
    stroke="#ffe500"
    stroke-width="18"
    stroke-linecap="round"
  />

  <line
    x1="865"
    y1="405"
    x2="910"
    y2="395"
    stroke="#ffe500"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- ========================= -->
  <!-- AI -->
  <!-- ========================= -->

  <text
    x="500"
    y="635"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="120"
    font-weight="900"
    letter-spacing="25"
    fill="#080808"
  >
    AI
  </text>

  <!-- Decorative lines -->
  <line
    x1="220"
    y1="600"
    x2="370"
    y2="600"
    stroke="#111111"
    stroke-width="14"
    stroke-linecap="round"
  />

  <line
    x1="630"
    y1="600"
    x2="780"
    y2="600"
    stroke="#111111"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- ========================= -->
  <!-- TAGLINE -->
  <!-- ========================= -->

  <text
    x="500"
    y="735"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="43"
    font-weight="700"
    letter-spacing="8"
    fill="#111111"
  >
    LOST • FOUND • TOGETHER
  </text>

  <!-- ========================= -->
  <!-- BOTTOM WARNING STRIPE -->
  <!-- ========================= -->

  <clipPath id="bottomClip">
    <rect x="40" y="835" width="920" height="125" rx="45"/>
  </clipPath>

  <g clip-path="url(#bottomClip)">
    <rect x="40" y="835" width="920" height="125" fill="#111111"/>

    <g fill="#ffe500">
      <polygon points="20,835 120,835 20,960 -80,960"/>
      <polygon points="190,835 290,835 190,960 90,960"/>
      <polygon points="360,835 460,835 360,960 260,960"/>
      <polygon points="530,835 630,835 530,960 430,960"/>
      <polygon points="700,835 800,835 700,960 600,960"/>
      <polygon points="870,835 970,835 870,960 770,960"/>
      <polygon points="1040,835 1140,835 1040,960 940,960"/>
    </g>
  </g>

</svg>